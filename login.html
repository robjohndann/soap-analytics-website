<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOAP Analytics — School Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #1B2A4A;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: #fff;
    border-radius: 12px;
    padding: 40px 36px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #0D7377;
    font-weight: 700;
    margin-bottom: 8px;
    text-align: center;
  }
  h1 {
    font-size: 21px;
    color: #1B2A4A;
    text-align: center;
    margin-bottom: 28px;
  }
  label {
    font-size: 12px;
    font-weight: 700;
    color: #1B2A4A;
    display: block;
    margin-bottom: 6px;
  }
  input[type="email"], input[type="password"] {
    width: 100%;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    padding: 11px 12px;
    border: 1px solid #DCE3EA;
    border-radius: 6px;
    margin-bottom: 16px;
  }
  input:focus {
    outline: none;
    border-color: #0D7377;
    box-shadow: 0 0 0 3px rgba(13,115,119,0.12);
  }
  .login-btn {
    width: 100%;
    background: #0D7377;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    padding: 13px;
    cursor: pointer;
  }
  .login-btn:hover { background: #0a5c5f; }
  .login-btn:disabled { opacity: 0.6; cursor: default; }
  .forgot-link {
    display: block;
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    color: #5A6B80;
    text-decoration: none;
  }
  .forgot-link:hover { color: #0D7377; }
  .msg {
    margin-top: 18px;
    font-size: 13px;
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    display: none;
  }
  .msg.show { display: block; }
  .msg.ok { background: #E6F4F1; color: #0D7377; }
  .msg.err { background: #FBE9E7; color: #B3261E; }
</style>
</head>
<body>

<div class="login-card">
  <div class="eyebrow">SOAP Analytics</div>
  <h1>School Login</h1>

  <form id="loginForm" onsubmit="event.preventDefault(); login();">
    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="you@yourschool.sch.uk">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Your password">

    <button type="submit" class="login-btn" id="loginBtn">Log in</button>
  </form>
  <a href="#" class="forgot-link" onclick="sendReset(event);">Forgot your password, or logging in for the first time?</a>

  <div class="msg" id="msg"></div>
</div>

<script>
  const SUPABASE_URL = 'https://caopycszjzrmwhxxvtpx.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_2CTGR0PKyRPpSk59lcr3sA_hvvUDX97';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  (async function checkAlreadyLoggedIn() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      window.location.href = 'portal.html';
    }
  })();

  function showMsg(text, isError) {
    const msg = document.getElementById('msg');
    msg.textContent = text;
    msg.className = 'msg show ' + (isError ? 'err' : 'ok');
  }

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) {
      showMsg('Please enter your email and password.', true);
      return;
    }
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Logging in…';

    const { error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      showMsg('Login failed: ' + error.message, true);
      btn.disabled = false;
      btn.textContent = 'Log in';
    } else {
      window.location.href = 'portal.html';
    }
  }

  async function sendReset(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) {
      showMsg('Type your email address above first, then click this link.', true);
      return;
    }
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/set-password.html'
    });
    if (error) {
      showMsg('Something went wrong: ' + error.message, true);
    } else {
      showMsg('Check your inbox — click the link we sent to set your password.', false);
    }
  }
</script>

</body>
</html>
