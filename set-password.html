<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOAP Analytics — Set Your Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #1B2A4A;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 40px 36px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #0D7377;
    font-weight: 700;
    margin-bottom: 8px;
    text-align: center;
  }
  h1 {
    font-size: 20px;
    color: #1B2A4A;
    text-align: center;
    margin-bottom: 24px;
  }
  label {
    font-size: 12px;
    font-weight: 700;
    color: #1B2A4A;
    display: block;
    margin-bottom: 6px;
  }
  input[type="password"] {
    width: 100%;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    padding: 11px 12px;
    border: 1px solid #DCE3EA;
    border-radius: 6px;
    margin-bottom: 16px;
  }
  input:focus {
    outline: none;
    border-color: #0D7377;
    box-shadow: 0 0 0 3px rgba(13,115,119,0.12);
  }
  .save-btn {
    width: 100%;
    background: #0D7377;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    padding: 13px;
    cursor: pointer;
  }
  .save-btn:hover { background: #0a5c5f; }
  .save-btn:disabled { opacity: 0.6; cursor: default; }
  .msg {
    margin-top: 18px;
    font-size: 13px;
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    display: none;
  }
  .msg.show { display: block; }
  .msg.ok { background: #E6F4F1; color: #0D7377; }
  .msg.err { background: #FBE9E7; color: #B3261E; }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">SOAP Analytics</div>
  <h1>Set your password</h1>

  <form id="setPasswordForm" onsubmit="event.preventDefault(); setPassword();">
    <label for="password">New password</label>
    <input type="password" id="password" placeholder="At least 8 characters">

    <label for="confirm">Confirm password</label>
    <input type="password" id="confirm" placeholder="Type it again">

    <button type="submit" class="save-btn" id="saveBtn">Save password</button>
  </form>

  <div class="msg" id="msg"></div>
</div>

<script>
  const SUPABASE_URL = 'https://caopycszjzrmwhxxvtpx.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_2CTGR0PKyRPpSk59lcr3sA_hvvUDX97';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function showMsg(text, isError) {
    const msg = document.getElementById('msg');
    msg.textContent = text;
    msg.className = 'msg show ' + (isError ? 'err' : 'ok');
  }

  // Expired or already-used invite/recovery links are redirected here by
  // Supabase with #error=...&error_code=... instead of a valid session.
  // Check for that, and for a genuinely missing session (e.g. someone
  // navigating here directly with no token at all), before the person
  // even tries to set a password — friendlier than waiting for a failed
  // submit. Works for both the invite journey and the recovery journey,
  // since supabase-js's default detectSessionInUrl establishes a session
  // from either link type the same way; this check only needs to notice
  // when that DIDN'T happen.
  window.addEventListener('DOMContentLoaded', async () => {
    const hasErrorInUrl = location.hash.includes('error=') || location.hash.includes('error_code=');
    const { data: { session } } = await sb.auth.getSession();
    if (hasErrorInUrl || !session) {
      document.getElementById('setPasswordForm').style.display = 'none';
      showMsg("This link has expired or is no longer valid. Please request a new password reset link from the login page, or contact SOAP Analytics support if you're setting up a new account.", true);
    }
  });

  async function setPassword() {
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (!password || password.length < 8) {
      showMsg('Password must be at least 8 characters.', true);
      return;
    }
    if (password !== confirm) {
      showMsg('Passwords don\'t match.', true);
      return;
    }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    const { error } = await sb.auth.updateUser({ password });

    if (error) {
      // Friendlier than the raw Supabase error — the most likely cause
      // at this point is the session/link expiring while the page sat
      // open, since the on-load check above already caught the common
      // case of an already-expired link.
      showMsg('This link may have expired. Please request a new password reset link and try again.', true);
      btn.disabled = false;
      btn.textContent = 'Save password';
    } else {
      showMsg('Password set! Taking you to the portal…', false);
      setTimeout(() => { window.location.href = 'portal.html'; }, 1500);
    }
  }
</script>

</body>
</html>
