<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOAP Analytics — School Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #1B2A4A;
    min-height: 100vh;
  }

  header {
    background: #1B2A4A;
    color: #fff;
    padding: 0 5%;
    height: 68px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .ribbon-left { display: flex; align-items: center; gap: 20px; }
  .logout-link { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 13px; }
  .logout-link:hover { color: #fff; }
  .admin-link { color: #3DCFB8; text-decoration: none; font-size: 13px; font-weight: 600; }

  .wrap { max-width: 560px; margin: 0 auto; padding: 40px 20px 60px; }
  .eyebrow { color: #3DCFB8; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; text-align: center; margin-bottom: 6px; }
  .greeting { color: #fff; font-size: 18px; text-align: center; margin-bottom: 28px; }
  .greeting strong { color: #3DCFB8; }

  .status-card { background: #fff; border-radius: 12px; padding: 32px 24px; text-align: center; }
  .status-card h1 { color: #1B2A4A; font-size: 20px; margin-bottom: 10px; }
  .status-card p { color: #5A6B80; font-size: 14px; line-height: 1.6; }
  .loading { color: #5A6B80; font-size: 14px; text-align: center; }

  .accordion { display: flex; flex-direction: column; gap: 10px; }
  .bar {
    width: 100%; background: #0D7377; color: #fff; border: none; border-radius: 8px;
    padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; font-family: inherit; text-align: left;
  }
  .bar.locked { background: #5A6B80; opacity: 0.85; cursor: not-allowed; }
  .bar-label { font-size: 15px; font-weight: 700; }
  .bar-right { display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 10px; background: rgba(255,255,255,0.18); }
  .badge.live { background: #3DCFB8; color: #0D2B4E; }
  .chev { transition: transform 0.2s; }
  .chev.open { transform: rotate(180deg); }
  .panel {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(61,207,184,0.3); border-top: none;
    border-radius: 0 0 8px 8px; padding: 14px 20px; display: none;
  }
  .panel.open { display: block; }
  .form-row {
    background: #0D2B4E; border-radius: 6px; padding: 10px 14px; margin-bottom: 6px;
    display: flex; align-items: center; justify-content: space-between; text-decoration: none;
  }
  .form-row:last-child { margin-bottom: 0; }
  .form-row span.name { color: #fff; font-size: 14px; }
  .pct-badge { color: #fff; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 9px; }
  .soap-row { cursor: pointer; }
  .soap-name { color: #fff; font-size: 14px; font-weight: 700; display: block; }
  .soap-date { color: rgba(255,255,255,0.5); font-size: 12px; }
  .locked-note { text-align: center; font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 6px; }
  .empty-note { color: rgba(255,255,255,0.6); font-size: 13px; text-align: center; padding: 8px 0; }
  .support-box { margin-top: 28px; text-align: center; }
  .support-title { color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .support-links { display: flex; justify-content: center; gap: 20px; }
  .support-links a { color: #3DCFB8; text-decoration: none; font-size: 14px; font-weight: 600; }
  .support-links a:hover { text-decoration: underline; }

  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box { background: #fff; border-radius: 12px; width: 100%; max-width: 1300px; height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal-header { background: #1B2A4A; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
  .modal-close { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
  .modal-box iframe { flex: 1; border: none; width: 100%; }

  @media (max-width: 700px) {
    .wrap { padding: 24px 16px 40px; }
  }
</style>
</head>
<body>

<header>
  <div class="ribbon-left">
    <a href="index.html"><img src="images/logo-navy.png" alt="SOAP Analytics" style="height:36px;width:auto;border-radius:6px;display:block;"></a>
    <a href="admin.html" id="adminLink" class="admin-link" style="display:none;">Admin Dashboard →</a>
    <a href="portal.html" id="switchSchoolLink" class="admin-link" style="display:none;">Switch School →</a>
  </div>
  <a href="#" class="logout-link" onclick="logout(event);">Log out</a>
</header>

<div class="wrap">
  <div id="statusArea">
    <p class="loading">Checking your login…</p>
  </div>
</div>

<div class="modal-overlay" id="soapModal">
  <div class="modal-box">
    <div class="modal-header">
      <span id="soapModalTitle">SOAP</span>
      <button type="button" class="modal-close" onclick="closeSoapModal();">×</button>
    </div>
    <iframe id="soapModalFrame" sandbox="allow-scripts allow-modals"></iframe>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://caopycszjzrmwhxxvtpx.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_2CTGR0PKyRPpSk59lcr3sA_hvvUDX97';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const CONTEXT_PERIODS = ['AUT1 26', 'AUT2 26', 'SPR1 27', 'SPR2 27', 'SUM1 27', 'SUM2 27'];
  const PERIOD_TO_REPORTING_NAME = {
    'AUT1 26': 'Autumn 1', 'AUT2 26': 'Autumn 2',
    'SPR1 27': 'Spring 1', 'SPR2 27': 'Spring 2',
    'SUM1 27': 'Summer 1', 'SUM2 27': 'Summer 2'
  };
  const ALL_YEAR_GROUPS = ['EYFS','Y1','Y2','Y3','Y4','Y5','Y6','Y7','Y8','Y9','Y10','Y11','Y12','Y13'];
  const PHASE_YEAR_GROUPS = {
    'Primary': ['EYFS','Y1','Y2','Y3','Y4','Y5','Y6'],
    'Infant': ['EYFS','Y1','Y2'],
    'Junior': ['Y3','Y4','Y5','Y6'],
    'Secondary': ['Y7','Y8','Y9','Y10','Y11','Y12','Y13'],
    'Sixth Form College': ['Y12','Y13']
  };

  // Package tier -> which sections are unlocked. Anything not matching one of
  // these four exact names (e.g. old test data, or a school never assigned a
  // package yet) falls through to everything locked, which is the safe default.
  const PACKAGE_FEATURES = {
    'IDSR Intelligence Summary': { soap: false, soapDashboard: false, idsrSoap: true, idsrDashboard: false },
    'IDSR Intelligence Summary + Dashboard': { soap: false, soapDashboard: false, idsrSoap: true, idsrDashboard: true },
    'SOAP Performance Summary': { soap: true, soapDashboard: false, idsrSoap: true, idsrDashboard: true },
    'SOAP Performance Suite': { soap: true, soapDashboard: true, idsrSoap: true, idsrDashboard: true }
  };
  function featuresFor(packageTier) {
    return PACKAGE_FEATURES[packageTier] || { soap: false, soapDashboard: false, idsrSoap: false, idsrDashboard: false };
  }

  function calcLockedPeriods(schoolReportingPeriods) {
    const today = new Date();
    const lockedPeriods = {};
    CONTEXT_PERIODS.forEach(p => {
      const reportingName = PERIOD_TO_REPORTING_NAME[p];
      const match = (schoolReportingPeriods || []).find(r => r.period_name === reportingName);
      lockedPeriods[p] = !(match && match.start_date) || (new Date(match.start_date) > today);
    });
    return lockedPeriods;
  }

  function contextCompletion(school, schoolReportingPeriods, contextRows) {
    const yearGroups = PHASE_YEAR_GROUPS[school.phase] || ALL_YEAR_GROUPS;
    const sections = [
      { rows: ['Number on Roll', 'PAN'], hasPan: false },
      { rows: yearGroups, hasPan: true },
      { rows: ['Boys %', 'FSM %', 'Pupil Premium %', 'Mobility %'], hasPan: false },
      { rows: ['Number of Teachers', 'Number of Support Staff', 'Number of SLT', 'Number of ECTs', 'Number of UPS Teachers'], hasPan: false }
    ];
    const lockedPeriods = calcLockedPeriods(schoolReportingPeriods);
    let total = 0;
    sections.forEach(section => {
      section.rows.forEach(() => {
        CONTEXT_PERIODS.forEach(p => { if (!lockedPeriods[p]) total++; });
        if (section.hasPan) total++;
      });
    });
    const filled = (contextRows || []).length;
    const pct = total ? Math.round((Math.min(filled, total) / total) * 100) : 0;
    return pct;
  }

  function schoolInfoCompletion(s) {
    const fields = [s.urn, s.school_type, s.number_on_roll, s.pan, s.person_responsible];
    const filled = fields.filter(f => f !== null && f !== undefined && f !== '').length;
    return Math.round((filled / fields.length) * 100);
  }

  function safeguardingCompletion(schoolReportingPeriods, rows) {
    const lockedPeriods = calcLockedPeriods(schoolReportingPeriods);
    let total = 0;
    CONTEXT_PERIODS.forEach(p => { if (!lockedPeriods[p]) total += 5; });
    total += 3 * 2;
    total += 1;
    const filled = (rows || []).length;
    return total ? Math.round((Math.min(filled, total) / total) * 100) : 0;
  }

  function inclusionCompletion(schoolReportingPeriods, rows) {
    const lockedPeriods = calcLockedPeriods(schoolReportingPeriods);
    let total = 0;
    CONTEXT_PERIODS.forEach(p => { if (!lockedPeriods[p]) total += 5; });
    total += 6; total += 4; total += 1;
    const filled = (rows || []).length;
    return total ? Math.round((Math.min(filled, total) / total) * 100) : 0;
  }

  function curriculumCompletion(rows) {
    const total = 12 + 1;
    const filled = (rows || []).length;
    return Math.round((Math.min(filled, total) / total) * 100);
  }

  function achievementCompletion(assessmentSetupRows, reportingPeriods, rows) {
    const today = (() => {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    })();
    const assessment = (name) => (assessmentSetupRows || []).find(a => a.assessment_name === name);
    const planned = (name) => {
      const row = assessment(name);
      return !!(row && row.planned === 'Yes');
    };
    const live = (name) => {
      const row = assessment(name);
      return !!(row && row.planned === 'Yes' && row.assessment_date && row.assessment_date <= today);
    };
    const gcsePeriods = new Set(['2022/23', '2023/24', '2024/25', '2025/26']);
    const post16Periods = new Set(['2022/23', '2023/24', '2024/25', '2025/26']);
    if (planned('Year 11 PPE 1') && live('Year 11 PPE 1')) gcsePeriods.add('PPE1');
    if (planned('Year 11 PPE 2') && live('Year 11 PPE 2')) gcsePeriods.add('PPE2');
    if (planned('Year 13 PPE 1') && live('Year 13 PPE 1')) post16Periods.add('PPE1');
    if (planned('Year 13 PPE 2') && live('Year 13 PPE 2')) post16Periods.add('PPE2');

    let total = 4; // Foundational Knowledge
    total += 10 * gcsePeriods.size;
    total -= 4; // Progress 8 rows have four historical cells intentionally unavailable
    total += 8 * post16Periods.size;
    total += 1; // Overall Rating

    const filled = (rows || []).filter(r => {
      if (r.category === 'GCSE Outcomes') return gcsePeriods.has(r.period);
      if (r.category === 'Post-16 Outcomes') return post16Periods.has(r.period);
      return true;
    }).length;
    const pct = total ? Math.round((Math.min(filled, total) / total) * 100) : 0;
    return pct;
  }

  function pdwCompletion(rows) {
    let total = 6*4 + 6*3 + 7*3 + 6*3 + 8 + 1;
    const filled = (rows || []).length;
    return Math.round((Math.min(filled, total) / total) * 100);
  }

  function leadershipCompletion(rows) {
    const total = 7 + 1;
    const filled = (rows || []).length;
    return Math.round((Math.min(filled, total) / total) * 100);
  }

  function financeCompletion(rows) {
    const total = 5*3 + 6*3 + 3*6 + 5 + 1;
    const filled = (rows || []).length;
    return Math.round((Math.min(filled, total) / total) * 100);
  }

  function attendanceCompletion(schoolReportingPeriods, rows) {
    const lockedPeriods = calcLockedPeriods(schoolReportingPeriods);
    let total = 0;
    CONTEXT_PERIODS.forEach(p => { if (!lockedPeriods[p]) total += 23; }); // 13 attendance % rows + 10 behaviour rows per period (National Attendance % removed — now sourced centrally, not entered per school)
    total += 1;
    const filled = (rows || []).length;
    return total ? Math.round((Math.min(filled, total) / total) * 100) : 0;
  }

  function pctColor(pct) {
    if (pct >= 90) return '#1D9E75';
    if (pct >= 50) return '#EF9F27';
    return '#D85A30';
  }

  function toggleAccordion(id) {
    const bar = document.getElementById('bar-' + id);
    if (bar.classList.contains('locked')) return;
    document.getElementById('panel-' + id).classList.toggle('open');
    document.getElementById('chev-' + id).classList.toggle('open');
  }

  async function submitSupportMessage(schoolId, role) {
    const input = document.getElementById('supportMessageInput');
    const btn = document.getElementById('supportSubmitBtn');
    const note = document.getElementById('supportNote');
    const message = input.value.trim();
    if (!message) {
      note.style.color = '#F3B8B8';
      note.textContent = 'Please type your issue before sending.';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Sending…';
    const { error } = await sb.rpc('msg_contributor_submit', { p_school_id: schoolId, p_message: message });
    if (error) {
      console.error(error);
      note.style.color = '#F3B8B8';
      note.textContent = 'Something went wrong — please try again.';
    } else {
      note.style.color = '#3DCFB8';
      note.textContent = "Sent — we'll be in touch shortly.";
      input.value = '';
    }
    btn.disabled = false;
    btn.textContent = 'Send to support';
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ----------------------------------------------------------------------
  // V63 Messaging — Leadership UX (portal.html). Reads message_threads/
  // support_messages already fetched for this school in checkLogin()'s
  // batch (RLS: has_school_role() already restricts these to this school
  // for a leadership caller). Every mutation goes exclusively through the
  // hardened msg_leadership_* RPCs — no raw insert/update/delete.
  // ----------------------------------------------------------------------

  async function refreshMessagingData() {
    const [threadsRes, messagesRes] = await Promise.all([
      sb.from('message_threads').select('*').eq('school_id', MSG_SCHOOL_ID),
      sb.from('support_messages').select('*').eq('school_id', MSG_SCHOOL_ID)
    ]);
    MSG_THREADS = threadsRes.data || [];
    MSG_ALL_MESSAGES = messagesRes.data || [];
  }

  function renderLeadershipSupportPanel() {
    const area = document.getElementById('supportLeadershipArea');
    if (!area) return;

    if (MSG_COMPOSE_MODE) { renderLeadershipCompose(); return; }
    if (MSG_ACTIVE_THREAD_ID) { renderLeadershipThreadDetail(); return; }

    const startBtn = `<div style="margin-bottom:12px;"><button type="button" onclick="msgLeadershipStartNew()" style="background:#3DCFB8;color:#0D2B4E;border:none;border-radius:6px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;">Start New Conversation</button></div>`;

    if (!MSG_THREADS.length) {
      area.innerHTML = startBtn + `<div style="font-size:13px;color:rgba(255,255,255,0.6);">No conversations yet.</div>`;
      return;
    }

    const sorted = [...MSG_THREADS].sort((a, b) => new Date(b.last_message_at) - new Date(a.last_message_at));
    area.innerHTML = startBtn + sorted.map(t => {
      const firstMsg = MSG_ALL_MESSAGES.find(m => m.thread_id === t.id);
      const preview = t.subject || (firstMsg ? (firstMsg.message.length > 50 ? firstMsg.message.slice(0, 50) + '…' : firstMsg.message) : '—');
      const unreadDot = t.unread_by_school ? '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#3DCFB8;margin-right:7px;flex-shrink:0;"></span>' : '';
      const statusTag = t.status === 'resolved' ? '<span style="color:rgba(255,255,255,0.45);font-size:11px;">Resolved</span>' : '<span style="color:#3DCFB8;font-size:11px;font-weight:700;">Open</span>';
      return `
        <a class="form-row" href="#" onclick="msgLeadershipOpenThread('${t.id}'); return false;" style="cursor:pointer;align-items:center;">
          <span class="name" style="display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${unreadDot}${escapeHtml(preview)}</span>
          <span style="flex-shrink:0;margin-left:10px;">${statusTag}</span>
        </a>`;
    }).join('');
  }

  function renderLeadershipThreadDetail() {
    const area = document.getElementById('supportLeadershipArea');
    const thread = MSG_THREADS.find(t => t.id === MSG_ACTIVE_THREAD_ID);
    if (!thread) { MSG_ACTIVE_THREAD_ID = null; renderLeadershipSupportPanel(); return; }
    const msgs = MSG_ALL_MESSAGES.filter(m => m.thread_id === thread.id)
      .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    const isResolved = thread.status === 'resolved';

    const composerOrPrompt = isResolved
      ? `<div style="background:rgba(255,255,255,0.06);border-radius:6px;padding:12px 14px;font-size:13px;color:rgba(255,255,255,0.7);">
           This conversation is resolved.
           <a href="#" onclick="msgLeadershipStartNew(); return false;" style="color:#3DCFB8;font-weight:700;text-decoration:none;">Start a new conversation →</a>
         </div>`
      : `<textarea id="msgLeadershipReplyInput" rows="3" placeholder="Type a reply…" style="width:100%;padding:10px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);background:#0D2B4E;color:#fff;font-family:inherit;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>
         <div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center;">
           <div id="msgLeadershipReplyNote" style="font-size:12px;font-weight:700;"></div>
           <button type="button" onclick="msgLeadershipSendReply('${thread.id}')" style="background:#3DCFB8;color:#0D2B4E;border:none;border-radius:6px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;">Send Reply</button>
         </div>`;

    area.innerHTML = `
      <div style="margin-bottom:12px;"><a href="#" onclick="msgLeadershipBackToList(); return false;" style="color:#3DCFB8;font-weight:700;text-decoration:none;font-size:13px;">← Back to conversations</a></div>
      <div style="font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:10px;">${escapeHtml(thread.subject || 'Support conversation')} ${isResolved ? '· <span style="color:rgba(255,255,255,0.45);">Resolved</span>' : ''}</div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px;max-height:340px;overflow-y:auto;">
        ${msgs.map(m => `
          <div style="align-self:${m.sender_is_admin ? 'flex-start' : 'flex-end'};max-width:80%;background:${m.sender_is_admin ? 'rgba(61,207,184,0.14)' : '#0D2B4E'};border-radius:8px;padding:8px 12px;">
            <div style="font-size:10px;font-weight:700;color:rgba(255,255,255,0.5);margin-bottom:3px;">${m.sender_is_admin ? 'SOAP Admin' : escapeHtml(m.role || 'You')} · ${m.created_at ? new Date(m.created_at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''}</div>
            <div style="font-size:13px;color:#fff;line-height:1.5;white-space:pre-wrap;">${escapeHtml(m.message || '')}</div>
          </div>`).join('')}
      </div>
      ${composerOrPrompt}
    `;
  }

  function renderLeadershipCompose() {
    const area = document.getElementById('supportLeadershipArea');
    area.innerHTML = `
      <div style="margin-bottom:12px;"><a href="#" onclick="msgLeadershipCancelCompose(); return false;" style="color:#3DCFB8;font-weight:700;text-decoration:none;font-size:13px;">← Back to conversations</a></div>
      <label style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;">Subject (optional)</label>
      <input type="text" id="msgLeadershipComposeSubject" style="width:100%;padding:9px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);background:#0D2B4E;color:#fff;margin:6px 0 12px;box-sizing:border-box;font-family:inherit;">
      <label style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;">Message</label>
      <textarea id="msgLeadershipComposeMessage" rows="4" style="width:100%;padding:9px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);background:#0D2B4E;color:#fff;margin:6px 0 12px;box-sizing:border-box;font-family:inherit;font-size:14px;resize:vertical;"></textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div id="msgLeadershipComposeNote" style="font-size:12px;font-weight:700;"></div>
        <button type="button" onclick="msgLeadershipSendNewThread()" style="background:#3DCFB8;color:#0D2B4E;border:none;border-radius:6px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;">Send</button>
      </div>
    `;
  }

  function msgLeadershipStartNew() {
    MSG_ACTIVE_THREAD_ID = null;
    MSG_COMPOSE_MODE = true;
    renderLeadershipSupportPanel();
  }

  function msgLeadershipCancelCompose() {
    MSG_COMPOSE_MODE = false;
    renderLeadershipSupportPanel();
  }

  async function msgLeadershipOpenThread(threadId) {
    MSG_COMPOSE_MODE = false;
    MSG_ACTIVE_THREAD_ID = threadId;
    renderLeadershipSupportPanel();
    const { error } = await sb.rpc('msg_leadership_mark_read', { p_thread_id: threadId });
    if (error) { console.error(error); return; }
    const t = MSG_THREADS.find(x => x.id === threadId);
    if (t) t.unread_by_school = false;
  }

  function msgLeadershipBackToList() {
    MSG_ACTIVE_THREAD_ID = null;
    MSG_COMPOSE_MODE = false;
    renderLeadershipSupportPanel();
  }

  async function msgLeadershipSendReply(threadId) {
    const input = document.getElementById('msgLeadershipReplyInput');
    const note = document.getElementById('msgLeadershipReplyNote');
    const message = input.value.trim();

      note.style.color = '#F3B8B8';

      return;
    }
    await refreshMessagingData();

  async function uploadIdsr(schoolId) {
    const input = document.getElementById('idsrFileInput');
    const btn = document.getElementById('idsrUploadBtn');
    const note = document.getElementById('idsrUploadNote');
    const file = input.files[0];
    if (!file) {
      note.style.color = '#F3B8B8';
      note.textContent = 'Choose a file first.';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Uploading…';
    note.style.color = '#5A6B80';
    note.textContent = 'Uploading your IDSR…';

    const storagePath = `${schoolId}/idsr.html`;

    const { error: uploadError } = await sb.storage.from('idsr-uploads').upload(storagePath, file, {
      upsert: true,
      contentType: 'text/html'
    });
    if (uploadError) {
      console.error(uploadError);
      note.style.color = '#F3B8B8';
      note.textContent = 'Upload failed — please try again.';
      btn.disabled = false;
      btn.textContent = 'Upload IDSR';
      return;
    }

    const { error: dbError } = await sb.from('idsr_uploads').upsert({
      school_id: schoolId,
      storage_path: storagePath,
      file_name: file.name,
      file_size: file.size,
      status: 'pending',
      uploaded_at: new Date().toISOString(),
      published_at: null
    }, { onConflict: 'school_id' });
    if (dbError) {
      console.error(dbError);
      note.style.color = '#F3B8B8';
      note.textContent = 'Uploaded, but something went wrong saving the record — contact support.';
      btn.disabled = false;
      btn.textContent = 'Upload IDSR';
      return;
    }

    note.style.color = '#3DCFB8';
    note.textContent = 'Uploaded — awaiting review.';
    await checkLogin();
  }

  // Published SOAP snapshots, keyed by published_soaps.id. Held in memory rather
  // than embedded in the DOM: a snapshot is a COMPLETE HTML document, and its own
  // closing script tags used to be backslash-escaped so they could sit inside a
  // text/plain script holder. That escaping was never reversed, so the iframe
  // received a mangled closing tag, its parser swallowed the rest of the
  // document, and the modal rendered blank. With no text round-trip there is
  // nothing to escape or unescape.
  // NOTE: never write a literal closing script tag inside this inline script,
  // not even in a comment — the HTML parser ends the script element there.
  const PUBLISHED_SOAP_HTML = {};

  function closeSoapModal() {
    document.getElementById('soapModal').classList.remove('open');
    document.getElementById('soapModalFrame').srcdoc = '';
  }

  const FULL_ACCESS_ROLES = ['Headteacher', 'Executive Headteacher', 'CEO', 'School Improvement Director'];

  let MSG_COMPOSE_MODE = false;
  const FULL_ACCESS_FORMS = [

    { label: 'Context', href: 'context-form.html', key: 'context' },

  const FORM_ACCESS = {

    'School Improvement Director': FULL_ACCESS_FORMS,

    'Safeguarding': [{ label: 'Safeguarding', href: 'safeguarding-form.html', key: 'safeguarding' }],

    'Curriculum & Teaching': [{ label: 'Curriculum & Teaching', href: 'curriculum-form.html', key: 'curriculum' }],

  async function checkLogin() {
    const statusArea = document.getElementById('statusArea');
    const { data: { session } } = await sb.auth.getSession();

    if (!session) {
      statusArea.innerHTML = '<div class="status-card"><h1>Not logged in</h1><p>Please <a href="login.html">log in</a> to access the portal.</p></div>';
      return;
    }

    const email = session.user.email;

    const { data: adminRow } = await sb.from('admins').select('auth_user_id').eq('auth_user_id', session.user.id).maybeSingle();
    if (adminRow) document.getElementById('adminLink').style.display = '';

    const { data: linkRows, error: linkError } = await sb
      .from('school_users')
      .select('school_id, role')
      .eq('auth_user_id', session.user.id);

    if (linkError) {
      statusArea.innerHTML = `<div class="status-card"><h1>Unable to load school access</h1><p>Please refresh or contact support.</p></div>`;
      return;
    }

    if (!linkRows || linkRows.length === 0) {
      if (adminRow) {
        statusArea.innerHTML = `<div class="status-card"><h1>Welcome back, Admin</h1><p>You're logged in as <strong>${email}</strong> with admin access.</p><p style="margin-top:16px;">Use <strong>Admin Dashboard</strong> in the top bar to see every school's submitted data.</p></div>`;
      } else {
        statusArea.innerHTML = `<div class="status-card"><h1>You're logged in as ${email}</h1><p>Your login is working correctly, but it isn't linked to a school yet. Contact your admin to get set up.</p></div>`;
      }
      return;
    }

    const params = new URLSearchParams(window.location.search);
    const requestedSchoolId = params.get('school_id');

    if (linkRows.length > 1 && !requestedSchoolId) {
      const schoolIds = linkRows.map(r => r.school_id);
      const { data: linkedSchools } = await sb.from('schools').select('id, name').in('id', schoolIds);
      const schoolNameById = Object.fromEntries((linkedSchools || []).map(s => [s.id, s.name]));
      statusArea.innerHTML = `
        <div class="status-card">
          <h1>Choose a school</h1>
          <p>Your account has access to more than one school. Select the school you want to work with.</p>
          <div style="margin-top:18px;display:grid;gap:10px;">
            ${linkRows.map(r => `<a href="portal.html?school_id=${encodeURIComponent(r.school_id)}" style="display:block;padding:14px 16px;border-radius:8px;background:#0D2B4E;color:#fff;text-decoration:none;font-weight:700;">${schoolNameById[r.school_id] || 'School'} <span style="opacity:.7;font-weight:500;">— ${r.role}</span></a>`).join('')}
          </div>
        </div>`;
      return;
    }

    const linkRow = requestedSchoolId
      ? linkRows.find(r => r.school_id === requestedSchoolId)
      : linkRows[0];

    if (!linkRow) {
      statusArea.innerHTML = `<div class="status-card"><h1>Access denied</h1><p>This school is not linked to your account. <a href="portal.html">Return to the portal</a>.</p></div>`;
      return;
    }

    if (linkRows.length > 1) {
      document.getElementById('switchSchoolLink').style.display = '';
    }

    // V60 (revised): section_access grants AUGMENT whatever the person's
    // school_users.role already provides — they never replace it. This
    // matters because the Edge Function deliberately preserves an existing
    // departmental role when granting an additional section (e.g. someone
    // with role='Achievement' later granted Attendance & Behaviour access
    // keeps both). A pure 'Contributor' still ends up with only their
    // granted sections, since FORM_ACCESS has no entry for that role and
    // contributes nothing on its own. Leadership roles are unaffected —
    // they already get every form from FORM_ACCESS, and the union below
    // just adds nothing new. Grants are always queried scoped to THIS
    // specific school, so they never leak across schools.
    const roleBasedForms = FORM_ACCESS[linkRow.role] || [];
    const { data: myGrants } = await sb.from('section_access')
      .select('section')
      .eq('auth_user_id', session.user.id)
      .eq('school_id', linkRow.school_id);
    const grantedSections = (myGrants || []).map(g => g.section);
    const grantedForms = FULL_ACCESS_FORMS.filter(f => grantedSections.includes(f.label));

    const availableFormsByKey = new Map();
    [...roleBasedForms, ...grantedForms].forEach(f => availableFormsByKey.set(f.key, f));
    const availableForms = Array.from(availableFormsByKey.values());

    const [
      schoolRes, periodsRes, contextRes, safeguardingRes, inclusionRes, curriculumRes,
      achievementRes, assessRes, attendanceRes, pdwRes, leadershipRes, financeRes, publishedRes, idsrRes,
      threadsRes, messagesRes
    ] = await Promise.all([
      sb.from('schools').select('*').eq('id', linkRow.school_id).maybeSingle(),
      sb.from('reporting_periods').select('*').eq('school_id', linkRow.school_id),
      sb.from('context_data').select('*').eq('school_id', linkRow.school_id),
      sb.from('safeguarding_data').select('*').eq('school_id', linkRow.school_id),
      sb.from('inclusion_data').select('*').eq('school_id', linkRow.school_id),
      sb.from('curriculum_data').select('*').eq('school_id', linkRow.school_id),
      sb.from('achievement_data').select('*').eq('school_id', linkRow.school_id),
      sb.from('assessment_setup').select('*').eq('school_id', linkRow.school_id),
      sb.from('attendance_data').select('*').eq('school_id', linkRow.school_id),
      sb.from('pdw_data').select('*').eq('school_id', linkRow.school_id),
      sb.from('leadership_governance_data').select('*').eq('school_id', linkRow.school_id),
      sb.from('finance_data').select('*').eq('school_id', linkRow.school_id),
      sb.from('published_soaps').select('*').eq('school_id', linkRow.school_id).order('published_at', { ascending: false }),
      sb.from('idsr_uploads').select('*').eq('school_id', linkRow.school_id).maybeSingle(),
      sb.from('message_threads').select('*').eq('school_id', linkRow.school_id),
      sb.from('support_messages').select('*').eq('school_id', linkRow.school_id)
    ]);

    const school = schoolRes.data || {};
    const periods = periodsRes.data || [];
    const features = featuresFor(school.package_tier);

    const PCT = {
      schoolSetup: schoolInfoCompletion(school),
      context: contextCompletion(school, periods, contextRes.data),
      safeguarding: safeguardingCompletion(periods, safeguardingRes.data),
      inclusion: inclusionCompletion(periods, inclusionRes.data),
      attendance: attendanceCompletion(periods, attendanceRes.data),
      curriculum: curriculumCompletion(curriculumRes.data),
      achievement: achievementCompletion(assessRes.data, periods, achievementRes.data),

    const isHeadteacher = FULL_ACCESS_ROLES.includes(linkRow.role);
    // V64 Stage 6 — deliberately NOT part of FULL_ACCESS_ROLES. Derived from

    // full portal at the first and the narrow one at the second. Never account-wide.
    const isViewer = linkRow.role === 'Viewer';
    const publishedSoaps = publishedRes.data || [];
    const idsrUpload = idsrRes.data || null;

    // V64 Stage 6 — a Viewer gets NEITHER the Data Entry Forms accordion NOR the

    let accordionHtml = isViewer ? '' : `

          <span class="bar-right">

              <span class="pct-badge" style="background:${pctColor(PCT[f.key] || 0)};">${PCT[f.key] || 0}%</span>
            </a>
          `).join('')}
        </div>
      </div>

      <div>
        <button type="button" class="bar" id="bar-support" onclick="toggleAccordion('support');">
          <span class="bar-label">Support</span>
          <span class="bar-right"><i class="chev" id="chev-support">▾</i></span>
        </button>
        <div class="panel" id="panel-support">
          ${isHeadteacher ? `<div id="supportLeadershipArea"><div style="font-size:13px;color:rgba(255,255,255,0.6);">Loading conversations…</div></div>` : `
          <div style="font-size:13px;color:rgba(255,255,255,0.7);margin-bottom:10px;">Having an issue or a question? Type it below and it'll come straight through to us.</div>
          <textarea id="supportMessageInput" rows="4" placeholder="Describe the issue you're having..." style="width:100%;padding:10px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);background:#0D2B4E;color:#fff;font-family:inherit;font-size:14px;resize:vertical;"></textarea>
          <button type="button" onclick="submitSupportMessage('${linkRow.school_id}', '${linkRow.role}')" id="supportSubmitBtn" style="margin-top:10px;background:#3DCFB8;color:#0D2B4E;border:none;border-radius:6px;padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer;">Send to support</button>
          <div id="supportNote" style="font-size:12px;font-weight:700;margin-top:8px;"></div>
          `}
        </div>
      </div>`;

    // V64 Stage 6 — View My SOAP is the ONE panel Leadership and Viewer share.
    // Package behaviour is unchanged: features.soap → the published list as before;
    // otherwise the existing locked bar. The published_soaps query and the
    // SOAP rendering/modal are untouched.
    if (isHeadteacher || isViewer) {
      // View My SOAP
      if (features.soap) {
        publishedSoaps.forEach(p => { PUBLISHED_SOAP_HTML[p.id] = p.html_content; });
        accordionHtml += `
        <div>
          <button type="button" class="bar" id="bar-soap" onclick="toggleAccordion('soap');">

              ? publishedSoaps.map((p, idx) => `

    if (isHeadteacher) {

        accordionHtml += `

          <button type="button" class="bar" id="bar-soapdash" onclick="toggleAccordion('soapdash');">

              <button type="button" id="idsrUploadBtn" onclick="uploadIdsr('${linkRow.school_id}')" style="background:#3DCFB8;color:#0D2B4E;border:none;border-radius:6px;padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer;">Upload a different file</button>

              <button type="button" id="idsrUploadBtn" onclick="uploadIdsr('${linkRow.school_id}')" style="background:#3DCFB8;color:#0D2B4E;border:none;border-radius:6px;padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer;">Upload a new IDSR (replaces this one)</button>

          ? `<a class="form-row" href="idsr-dashboard.html?school_id=${linkRow.school_id}" target="_blank"><span class="name">Open IDSR Dashboard</span></a>`
          : `<div class="empty-note">Your IDSR Dashboard will appear here once your uploaded IDSR has been reviewed and published \u2014 see IDSR SOAP above to upload.</div>`;
        accordionHtml += `
        <div>
          <button type="button" class="bar" id="bar-idsrdash" onclick="toggleAccordion('idsrdash');">
            <span class="bar-label">IDSR Dashboard</span>
            <span class="bar-right"><span class="badge live">Live</span><i class="chev" id="chev-idsrdash">▾</i></span>

    document.getElementById('statusArea').innerHTML = `

      MSG_THREADS = threadsRes.data || [];
      MSG_ALL_MESSAGES = messagesRes.data || [];
      renderLeadershipSupportPanel();
    }
  }

  checkLogin();
</script>
