<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SOAP Analytics — IDSR Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#0D2B4E; --teal:#1A7A6E; --pale:#F0F4F8;
    --exceptional:#A9D6F5; --strong:#B8D8C8; --expected:#D4EDDA; --attention:#FAE3C6; --urgent:#F5C6C2;
    --text-dark:#1B2A4A; --text-muted:#5B6B7F;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI', Arial, sans-serif; background:var(--pale); color:var(--text-dark); }
  .topbar { background:var(--navy); color:white; padding:18px 28px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .topbar .brand { font-size:12px; letter-spacing:1.5px; opacity:0.7; text-transform:uppercase; }
  .topbar h1 { font-size:19px; margin:2px 0 0; font-weight:700; }
  .publish-btn { background:var(--teal); color:white; border:none; border-radius:6px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; }
  .publish-btn:hover { background:#158a7d; }
  .publish-btn:disabled { background:#4a6a7d; cursor:default; }
  .status-pill { font-size:12px; font-weight:700; padding:5px 12px; border-radius:12px; }
  .status-pill.pending { background:#FAE3C6; color:#7A4A00; }
  .status-pill.published { background:#B8D8C8; color:#1A4D2E; }

  .shell { display:none; }
  .shell.visible { display:grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 66px); }
  .sidebar { background:var(--navy); padding:18px 12px; display:flex; flex-direction:column; gap:8px; }
  .sidebar .sidebar-label { color: rgba(255,255,255,0.5); font-size:10.5px; text-transform:uppercase; letter-spacing:1px; padding: 0 8px 4px; }
  .nav-item { display:block; width:100%; text-align:left; border:none; cursor:pointer; background: rgba(255,255,255,0.06); color:#D7E3F0; padding: 12px 14px; border-radius:6px; font-size:13px; font-weight:600; transition: background 0.12s; }
  .nav-item:hover { background: rgba(255,255,255,0.14); }
  .nav-item.active { background: var(--teal); color:white; }

  .content { padding: 26px 30px; }
  .empty-state { background:white; border-radius:12px; padding:60px 30px; text-align:center; color:var(--text-muted); box-shadow:0 1px 3px rgba(13,43,78,0.08); max-width:900px; margin: 26px auto; }
  .empty-state h2 { color:var(--navy); font-size:18px; margin-bottom:8px; }
  .note { background:#FFF7E6; border-left:4px solid #E0A526; color:#6B4E00; padding:10px 14px; border-radius:6px; font-size:12.5px; margin: 0 30px 20px; display:none; }
  .note.visible { display:block; }

  .card-layout { display:grid; grid-template-columns: 1.5fr 1fr; gap:24px; align-items:start; }
  .card-layout.single-col { grid-template-columns: 1fr; max-width: 1100px; }
  .card-title { font-size:16px; font-weight:700; color:var(--navy); margin:0 0 14px; }

  .soap-panel, .panel { background:white; border-radius:10px; padding:20px 22px; box-shadow:0 1px 3px rgba(13,43,78,0.08); overflow-x:auto; margin-bottom:24px; }
  .panel-sub { font-size:12px; color:var(--text-muted); margin-bottom:14px; }
  .panel h3 { font-size:15px; color:var(--navy); margin:0 0 4px; }

  table.data-table { width:100%; border-collapse:collapse; }
  table.data-table th { background:var(--teal); color:white; font-size:10.5px; padding:7px 6px; text-align:center; font-weight:600; white-space:nowrap; }
  table.data-table th:first-child { text-align:left; padding-left:10px; }
  table.data-table td { padding:6px 6px; font-size:11.5px; text-align:center; border-bottom:1px solid #EEF1F4; white-space:nowrap; }
  table.data-table td:first-child { text-align:left; padding-left:10px; white-space:normal; }
  table.data-table td.natcell { font-style:italic; background:var(--pale) !important; }
  table.data-table td.gapcell { font-style:italic; font-size:10.5px; color:var(--text-muted); }
  table.data-table tr.section-row td { background:var(--navy); color:white; font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:0.5px; padding:7px 10px; }
  table.data-table tbody tr.data-row { cursor:pointer; transition: filter 0.1s; }
  table.data-table tbody tr.data-row:hover td { filter:brightness(0.96); }
  table.data-table tbody tr.data-row.row-selected { outline:2px solid var(--navy); outline-offset:-2px; }
  table.data-table tbody tr.data-row.row-selected td:first-child { font-weight:700; }
  .cell-exceptional { background: var(--exceptional); }
  .cell-strong { background: var(--strong); }
  .cell-expected { background: var(--expected); }
  .cell-attention { background: var(--attention); }
  .cell-urgent { background: var(--urgent); }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; font-size:11px; color:var(--text-muted); }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .legend i { width:12px; height:12px; border-radius:3px; display:inline-block; }
  .no-data { color: var(--text-muted); font-style: italic; text-align:left; padding: 10px; }

  .dash-card { background:white; border-radius:10px; padding:18px 20px; box-shadow:0 1px 3px rgba(13,43,78,0.08); position:sticky; top:20px; }
  .dash-card h4 { margin:0 0 4px; font-size:13.5px; color:var(--navy); }
  .dash-card .dash-sub { font-size:11.5px; color:var(--text-muted); margin-bottom:12px; }
  .gap-info { font-size:12px; margin-top:10px; padding:10px; background:var(--pale); border-radius:6px; }
  .gap-info b { color:var(--navy); }
  .badge { font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px; white-space:nowrap; margin-left:8px; }
  .badge.exceptional { background: var(--exceptional); color:#0D2B4E; }
  .badge.strong { background: var(--strong); color:#1A4D2E; }
  .badge.expected { background: var(--expected); color:#2C5F3D; }
  .badge.attention { background: var(--attention); color:#7A4A00; }
  .badge.urgent { background: var(--urgent); color:#7A1F1F; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="brand">SOAP Analytics</div>
    <h1 id="pageTitle">IDSR Dashboard</h1>
  </div>
  <div id="topbarActions" style="display:flex; align-items:center; gap:12px;"></div>
</div>

<div class="empty-state" id="emptyState">
  <h2 id="emptyStateTitle">Loading\u2026</h2>
  <p id="emptyStateBody">Checking your access and fetching the latest IDSR upload.</p>
</div>

<div class="note" id="parseNote"></div>

<div class="shell" id="shell">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-label">IDSR Cards</div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
// ============================================================================
// 1. PARSER — shared, unmodified across every card.
// ============================================================================
function parseIDSRHtml(htmlText) {
  const doc = new DOMParser().parseFromString(htmlText, 'text/html');
  const data = {};
  const h3s = Array.from(doc.querySelectorAll('h3'));
  for (const h3 of h3s) {
    const label = h3.textContent.replace(/\s+/g, ' ').trim();
    if (!label.includes(' - ')) continue;
    const splitIdx = label.indexOf(' - ');
    const group = label.slice(0, splitIdx).trim();
    const measure = label.slice(splitIdx + 3).trim();
    let tbl = null;
    let cursor = h3;
    while (cursor) {
      cursor = cursor.nextElementSibling;
      if (!cursor) break;
      if (cursor.tagName === 'TABLE') { tbl = cursor; break; }
      const found = cursor.querySelector && cursor.querySelector('table');
      if (found) { tbl = found; break; }
    }
    if (!tbl) continue;
    const theadRows = Array.from(tbl.querySelectorAll('thead tr'));
    if (theadRows.length === 0) continue;
    let colIds = [];
    if (theadRows.length === 1) {
      colIds = Array.from(theadRows[0].querySelectorAll('th')).map(th => th.id || null);
    } else {
      const row1Ths = Array.from(theadRows[0].querySelectorAll('th'));
      const row2Ids = Array.from(theadRows[1].querySelectorAll('th')).map(th => th.id || null);
      let row2Ptr = 0;
      for (const th of row1Ths) {
        const colspan = parseInt(th.getAttribute('colspan') || '1', 10);
        const rowspan = parseInt(th.getAttribute('rowspan') || '1', 10);
        if (rowspan > 1) colIds.push(th.id || null);
        else for (let i = 0; i < colspan; i++) { colIds.push(row2Ids[row2Ptr] !== undefined ? row2Ids[row2Ptr] : null); row2Ptr++; }
      }
    }
    const rows = [];
    for (const tr of Array.from(tbl.querySelectorAll('tbody tr'))) {
      const cells = Array.from(tr.querySelectorAll('td,th'));
      const texts = cells.map(td => td.textContent.trim());
      if (texts.length !== colIds.length) continue;
      const rowObj = {};
      colIds.forEach((id, i) => { if (id) rowObj[id] = texts[i]; });
      rows.push(rowObj);
    }
    const key = group + ' - ' + measure;
    if (data[key]) data[key].push(...rows); else data[key] = rows;
  }
  return data;
}

function toNumber(s) {
  if (s === null || s === undefined) return null;
  s = s.trim().replace(/%$/, '');
  if (s === '' || s === '-' || s === '\u2014') return null;
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function byAcademicMap(rows) {
  const byAcademic = {};
  for (const row of rows) {
    let calYear = row.datayear;
    if (!calYear) continue;
    if (calYear.includes('/')) byAcademic[calYear] = row;
    else if (/^\d+$/.test(calYear)) { const y = parseInt(calYear, 10); byAcademic[(y - 1) + '/' + String(y).slice(-2)] = row; }
  }
  return byAcademic;
}

function getSeries(idsrData, group, measure, yearLabels) {
  const rows = idsrData[group + ' - ' + measure] || [];
  const byAcademic = byAcademicMap(rows);
  const values = [], natByYear = [], natValsPresent = [];
  for (const yl of yearLabels) {
    const row = byAcademic[yl];
    if (!row) { values.push(null); natByYear.push(null); continue; }
    const sv = toNumber(row.value_rounded), nv = toNumber(row.nat_value_rounded);
    values.push(sv); natByYear.push(nv);
    if (nv !== null) natValsPresent.push(nv);
  }
  const natAvg = natValsPresent.length ? Math.round((natValsPresent.reduce((a,b)=>a+b,0)/natValsPresent.length)*100)/100 : null;
  return { values, natByYear, natAvg };
}

function getGapSeries(idsrData, group, measure, yearLabels) {
  const rows = idsrData[group + ' - ' + measure] || [];
  const byAcademic = byAcademicMap(rows);
  const values = [], natDisByYear = [], natNonDisByYear = [], gapByYear = [], gapTrendByYear = [];
  for (const yl of yearLabels) {
    const row = byAcademic[yl];
    if (!row) { values.push(null); natDisByYear.push(null); natNonDisByYear.push(null); gapByYear.push(null); gapTrendByYear.push(null); continue; }
    values.push(toNumber(row.value_rounded));
    natDisByYear.push(toNumber(row.nat_value_rounded));
    natNonDisByYear.push(toNumber(row.other_nat_value_rounded));
    gapByYear.push(toNumber(row.dis_gap_rounded));
    gapTrendByYear.push(row.trend_text || null);
  }
  return { values, natDisByYear, natNonDisByYear, gapByYear, gapTrendByYear };
}

function parsePermanentExclusionsWholeSchool(doc) {
  const startAnchor = doc.getElementById('suspensions-and-permanent-exclusions---whole-school');
  const endAnchor = doc.getElementById('suspensions-and-permanent-exclusions---16-18');
  if (!startAnchor) return null;
  const allH3 = Array.from(doc.querySelectorAll('h3'));
  const startIdx = allH3.indexOf(startAnchor);
  const endIdx = endAnchor ? allH3.indexOf(endAnchor) : allH3.length;
  const sectionH3s = allH3.slice(startIdx, endIdx === -1 ? undefined : endIdx);
  const reasonsHeading = sectionH3s.find(h => h.textContent.replace(/\s+/g, ' ').trim() === 'Permanent exclusion reasons');
  if (!reasonsHeading) return null;
  let tbl = null; let cursor = reasonsHeading;
  while (cursor) {
    cursor = cursor.nextElementSibling;
    if (!cursor) break;
    if (cursor.tagName === 'TABLE') { tbl = cursor; break; }
    const found = cursor.querySelector && cursor.querySelector('table');
    if (found) { tbl = found; break; }
  }
  if (!tbl) return null;
  const headerCells = Array.from(tbl.querySelectorAll('thead th'));
  const years = headerCells.slice(1).map(th => th.textContent.trim());
  if (years.length === 0) return null;
  let schoolCounts = null, natCounts = null;
  for (const tr of tbl.querySelectorAll('tbody tr')) {
    const cells = Array.from(tr.querySelectorAll('td'));
    if (cells.length === 0) continue;
    const label = cells[0].textContent.replace(/\s+/g, ' ').trim().toLowerCase();
    const vals = cells.slice(1).map(td => toNumber(td.textContent.trim()));
    if (label.includes('total number') && label.includes('permanent')) schoolCounts = vals;
    else if (label.includes('national average') && label.includes('permanent')) natCounts = vals;
  }
  if (!schoolCounts || !natCounts) return null;
  return { years, schoolCounts, natCounts };
}

function bandExclusionCount(school, nat) {
  if (school === null || school === undefined || nat === null || nat === undefined) return null;
  if (school === 0) return 'exceptional';
  const diff = school - nat;
  if (diff > 2) return 'urgent';
  if (diff > 0) return 'attention';
  if (diff === 0) return 'expected';
  return 'strong';
}

function toDestNumber(s) { return toNumber(s); }

function parseDestinationsPanel(doc, panelId, targetLabels) {
  const panel = doc.getElementById(panelId);
  if (!panel) return null;
  const tables = Array.from(panel.querySelectorAll('table.gt_table'));
  if (tables.length < 2) return null;
  function extractTable(tbl) {
    const headerCells = Array.from(tbl.querySelectorAll('thead th')).slice(1);
    const years = headerCells.map(th => {
      const m = th.textContent.match(/(\d{4})\s*leavers/i);
      return m ? m[1] + ' leavers' : th.textContent.trim();
    });
    const result = {};
    for (const label of targetLabels) {
      const tr = Array.from(tbl.querySelectorAll('tbody tr')).find(row => {
        const first = row.querySelector('td');
        return first && first.textContent.trim() === label;
      });
      if (!tr) { result[label] = null; continue; }
      const cells = Array.from(tr.querySelectorAll('td')).slice(1);
      const values = [], sigLabels = [];
      for (const td of cells) {
        const divs = td.querySelectorAll('div');
        if (divs.length >= 2) { sigLabels.push(divs[0].textContent.trim()); values.push(toDestNumber(divs[1].textContent)); }
        else { sigLabels.push(null); values.push(null); }
      }
      result[label] = { values, sigLabels };
    }
    return { years, rows: result };
  }
  return { allPupils: extractTable(tables[0]), disadvantaged: extractTable(tables[1]) };
}

function bandFromSig(sig) {
  if (!sig) return null;
  const l = sig.toLowerCase();
  if (l.includes('sig above')) return 'exceptional';
  if (l.includes('sig below')) return 'attention';
  if (l.includes('non-sig')) return 'expected';
  return null;
}

const DEST_TARGET_LABELS = [
  { label: 'Sustained education, employment or training', display: 'EET' },
  { label: 'Destination not sustained', display: 'NEET' },
  { label: 'Activity not captured', display: 'Unknown' },
];

// ============================================================================
// 2. CLASSIFY + BAND — shared, unmodified since the A8-abbreviation fix.
// ============================================================================
function classify(measureLabel) {
  const l = measureLabel.toLowerCase();
  const lowerBetter = ['persistent absence', 'suspension', 'exclusion'].some(k => l.includes(k));
  if (l.includes('progress 8') || l === 'va' || l.includes('value added') || l.endsWith('va') || l.includes(' p8')) {
    return { kind: 'idx', lowerBetter };
  }
  if (l.includes('attainment 8') || l.includes('aps') || l.endsWith('a8') || l.includes(' a8')) {
    return { kind: 'pts', lowerBetter };
  }
  return { kind: 'pct', lowerBetter };
}

const THRESH = { pct: 2.0, pts: 0.5, idx: 0.1 };

function computeBand(diff, kind, lowerBetter) {
  const th = THRESH[kind];
  const d = lowerBetter ? -diff : diff;
  if (d >= 2 * th) return 'exceptional';
  if (d >= th) return 'strong';
  if (d > -th) return 'expected';
  if (d <= -2 * th) return 'urgent';
  return 'attention';
}

function cellBand(row, i) {
  const v = row.values[i];
  let n = row.natByYear[i];
  if (n === null || n === undefined) n = row.natAvg;
  if (v === null || v === undefined || n === null || n === undefined) return null;
  if (row.isCount) return bandExclusionCount(v, n);
  return computeBand(v - n, row.kind, row.lowerBetter);
}

const BAND_LABEL = { exceptional:'Exceptional', strong:'Strong Standard', expected:'Expected Standard', attention:'Needs Attention', urgent:'Urgent Improvement' };

function lastAvailableIdx(row) {
  for (let i = row.values.length - 1; i >= 0; i--) if (row.values[i] !== null && row.natByYear[i] !== null) return i;
  return row.values.length - 1;
}
function lastAvailableGapIdx(row) {
  for (let i = row.gapByYear.length - 1; i >= 0; i--) if (row.gapByYear[i] !== null && row.gapByYear[i] !== undefined) return i;
  return -1;
}

// ============================================================================
// 3. CARD ROW DEFINITIONS
// ============================================================================
const CARD_ROWS_ATTENDANCE = [
  { section: 'Attendance',          group: 'All pupils', measure: 'Attendance' },
  { section: 'Attendance',          group: 'FSM6',        measure: 'Attendance' },
  { section: 'Attendance',          group: 'SEN',         measure: 'Attendance' },
  { section: 'Persistent Absence',  group: 'All pupils', measure: 'Persistent absence' },
  { section: 'Persistent Absence',  group: 'FSM6',        measure: 'Persistent absence' },
  { section: 'Persistent Absence',  group: 'SEN',         measure: 'Persistent absence' },
  { section: '1+ Suspensions',      group: 'All pupils', measure: '1 or more suspensions' },
  { section: '1+ Suspensions',      group: 'FSM6',        measure: '1 or more suspensions' },
  { section: '1+ Suspensions',      group: 'SEN',         measure: '1 or more suspensions' },
  { section: '2+ Suspensions',      group: 'All pupils', measure: '2 or more suspensions' },
  { section: '2+ Suspensions',      group: 'FSM6',        measure: '2 or more suspensions' },
  { section: '2+ Suspensions',      group: 'SEN',         measure: '2 or more suspensions' },
];

const CARD_ROWS_P8 = [
  { section: 'Overall P8', group: 'All pupils',            measure: 'Overall P8' },
  { section: 'Overall P8', group: 'Disadvantaged pupils',  measure: 'Overall P8' },
  { section: 'Overall P8', group: 'Low prior attainers',   measure: 'Overall P8' },
  { section: 'Overall P8', group: 'Middle prior attainers',measure: 'Overall P8' },
  { section: 'Overall P8', group: 'High prior attainers',  measure: 'Overall P8' },
];

// Note DfE's own inconsistent group naming here: APS/Best3/AAB% measures are
// published under "All pupils", but VA measures are published under
// "All students" — confirmed consistent across all three schools, not noise.
const CARD_ROWS_ALEVEL = [
  { section: 'A Level APS',            group: 'All pupils',   measure: 'A level APS' },
  { section: 'Best 3 A Level APS',     group: 'All pupils',   measure: 'Best 3 A level APS' },
  { section: 'A Level AAB %',          group: 'All pupils',   measure: 'A level AAB percentage' },
  { section: 'A Level VA',             group: 'All students', measure: 'A level VA' },
  { section: 'Applied General APS',    group: 'All pupils',   measure: 'Applied general APS' },
  { section: 'Applied General VA',     group: 'All students', measure: 'Applied general VA' },
];

const GCSE_METRICS = [
  { section: 'English & Maths 5+ (%)',  measure: 'English and mathematics grade 5 plus' },
  { section: 'English & Maths 4+ (%)',  measure: 'English and mathematics grade 4 plus' },
  { section: 'Attainment 8',            measure: 'Overall A8' },
  { section: 'Progress 8',              measure: 'Overall P8' },
  { section: 'EBacc Attainment 8',      measure: 'EBacc A8' },
  { section: 'EBacc Progress 8',        measure: 'EBacc P8' },
];

const SUBJECT_METRICS = {
  english:     [ { section: 'English Attainment 8', measure: 'English A8' }, { section: 'English Progress 8', measure: 'English P8' }, { section: 'English 4+ (%)', measure: 'English grade 4 plus' }, { section: 'English 5+ (%)', measure: 'English grade 5 plus' } ],
  mathematics: [ { section: 'Mathematics Attainment 8', measure: 'Mathematics A8' }, { section: 'Mathematics Progress 8', measure: 'Mathematics P8' }, { section: 'Mathematics 4+ (%)', measure: 'Mathematics grade 4 plus' }, { section: 'Mathematics 5+ (%)', measure: 'Mathematics grade 5 plus' } ],
  science:     [ { section: 'Science 4+ (%)', measure: 'Science grade 4 plus' }, { section: 'Science 5+ (%)', measure: 'Science grade 5 plus' }, { section: 'Science Value Added', measure: 'Science VA' } ],
  languages:   [ { section: 'Languages 4+ (%)', measure: 'Languages grade 4 plus' }, { section: 'Languages 5+ (%)', measure: 'Languages grade 5 plus' }, { section: 'Languages Value Added', measure: 'Languages VA' } ],
  humanities:  [ { section: 'Humanities 4+ (%)', measure: 'Humanities grade 4 plus' }, { section: 'Humanities 5+ (%)', measure: 'Humanities grade 5 plus' }, { section: 'Humanities Value Added', measure: 'Humanities VA' } ],
};

// Prior Attainment card re-cuts the exact same headline + subject measures
// above by prior-attainment cohort instead of by subject or disadvantaged
// status — confirmed every one of these exists under Low/Middle/High prior
// attainers across all three schools before building this.
const PRIOR_ATTAINMENT_METRICS = [
  ...GCSE_METRICS,
  ...SUBJECT_METRICS.english,
  ...SUBJECT_METRICS.mathematics,
  ...SUBJECT_METRICS.science,
  ...SUBJECT_METRICS.languages,
  ...SUBJECT_METRICS.humanities,
];
const PRIOR_ATTAINMENT_COHORTS = ['Low prior attainers', 'Middle prior attainers', 'High prior attainers'];

// ============================================================================
// 4. CARD METADATA — drives the sidebar + which build/render path each card uses
// ============================================================================
const CARD_META = [
  { key: 'attendance',  title: 'Attendance & Suspension Trends', type: 'metric-table', firstColLabel: 'Metric' },
  { key: 'p8',          title: 'Progress 8 (Overall P8)',        type: 'metric-table', firstColLabel: 'Cohort' },
  { key: 'alevel',      title: 'A Level Headline',                type: 'metric-table', firstColLabel: 'Metric' },
  { key: 'destinations',title: 'Destinations',                   type: 'destinations' },
  { key: 'gcse',        title: 'GCSE Headline',                  type: 'metric-table-gap', firstColLabel: 'Metric' },
  { key: 'english',     title: 'English',                        type: 'metric-table-gap', firstColLabel: 'Metric' },
  { key: 'mathematics', title: 'Mathematics',                    type: 'metric-table-gap', firstColLabel: 'Metric' },
  { key: 'science',     title: 'Science',                        type: 'metric-table-gap', firstColLabel: 'Metric' },
  { key: 'languages',   title: 'Languages',                      type: 'metric-table-gap', firstColLabel: 'Metric' },

let PARSED = null;   // { idsrData, doc }

function buildYearAxis(idsrData, rowSpecs) {
  const yearSet = new Set();
  for (const spec of rowSpecs) {
    for (const row of (idsrData[spec.group + ' - ' + spec.measure] || [])) {
      if (!row.datayear) continue;
      if (row.datayear.includes('/')) yearSet.add(row.datayear);
      else if (/^\d+$/.test(row.datayear)) { const y = parseInt(row.datayear, 10); yearSet.add((y - 1) + '/' + String(y).slice(-2)); }
    }
  }
  return Array.from(yearSet).sort((a, b) => parseInt(a) - parseInt(b));
}

function buildAttendanceCard(idsrData, doc) {
  const years = buildYearAxis(idsrData, CARD_ROWS_ATTENDANCE);
  const rows = CARD_ROWS_ATTENDANCE.map(spec => {
    const { values, natByYear, natAvg } = getSeries(idsrData, spec.group, spec.measure, years);
    const { kind, lowerBetter } = classify(spec.measure);
    return { section: spec.section, group: spec.group, measure: spec.measure, label: spec.measure + ' \u2014 ' + spec.group, values, natByYear, natAvg, kind, lowerBetter };
  });
  const pex = parsePermanentExclusionsWholeSchool(doc);
  if (pex) {
    const values = years.map(y => { const i = pex.years.indexOf(y); return i === -1 ? null : pex.schoolCounts[i]; });
    const natByYear = years.map(y => { const i = pex.years.indexOf(y); return i === -1 ? null : pex.natCounts[i]; });
    const natValsPresent = natByYear.filter(v => v !== null);
    const natAvg = natValsPresent.length ? Math.round((natValsPresent.reduce((a,b)=>a+b,0)/natValsPresent.length)*100)/100 : null;
    rows.push({ section: 'Permanent Exclusions', group: 'All pupils', measure: 'Permanent exclusions', label: 'Permanent Exclusions \u2014 All pupils', values, natByYear, natAvg, kind: 'count', lowerBetter: true, isCount: true });
  }
  return { years, rows };
}

function buildP8Card(idsrData) {
  const years = buildYearAxis(idsrData, CARD_ROWS_P8);
  const rows = CARD_ROWS_P8.map(spec => {
    const { values, natByYear, natAvg } = getSeries(idsrData, spec.group, spec.measure, years);
    const { kind, lowerBetter } = classify(spec.measure);
    return { section: spec.section, group: spec.group, measure: spec.measure, label: spec.group, values, natByYear, natAvg, kind, lowerBetter };
  });
  return { years, rows };
}

// Generic simple builder — one row per spec, no gap columns. Reused for
// A Level Headline (and any future single-cohort card).
function buildSimpleCard(idsrData, rowSpecs) {
  const years = buildYearAxis(idsrData, rowSpecs);
  const rows = rowSpecs.map(spec => {
    const { values, natByYear, natAvg } = getSeries(idsrData, spec.group, spec.measure, years);
    const { kind, lowerBetter } = classify(spec.measure);
    return { section: spec.section, group: spec.group, measure: spec.measure, label: spec.section + ' \u2014 ' + spec.group, values, natByYear, natAvg, kind, lowerBetter };
  });
  return { years, rows };
}

// Generic builder for GCSE Headline + every subject card (All pupils + Disadvantaged/Gap rows per metric)
function buildMetricGapCard(idsrData, metrics) {
  const yearSet = new Set();
  for (const m of metrics) {
    for (const cohort of ['All pupils', 'Disadvantaged pupils']) {
      for (const row of (idsrData[cohort + ' - ' + m.measure] || [])) {
        if (!row.datayear) continue;
        if (row.datayear.includes('/')) yearSet.add(row.datayear);
        else if (/^\d+$/.test(row.datayear)) { const y = parseInt(row.datayear, 10); yearSet.add((y - 1) + '/' + String(y).slice(-2)); }
      }
    }
  }
  const allYears = Array.from(yearSet).sort((a, b) => parseInt(a) - parseInt(b));
  const years = allYears.slice(-3);

  const rows = [];
  for (const m of metrics) {
    const { kind, lowerBetter } = classify(m.measure);
    const allSeries = getSeries(idsrData, 'All pupils', m.measure, years);
    rows.push({ section: m.section, group: 'All pupils', measure: m.measure, label: m.section + ' \u2014 All pupils', kind, lowerBetter, isGap: false, values: allSeries.values, natByYear: allSeries.natByYear, natAvg: allSeries.natAvg });

    const gapSeries = getGapSeries(idsrData, 'Disadvantaged pupils', m.measure, years);
    rows.push({ section: m.section, group: 'Disadvantaged', measure: m.measure, label: m.section + ' \u2014 Disadvantaged', kind, lowerBetter, isGap: true, values: gapSeries.values, natByYear: gapSeries.natDisByYear, natNonDisByYear: gapSeries.natNonDisByYear, gapByYear: gapSeries.gapByYear, gapTrendByYear: gapSeries.gapTrendByYear });
  }
  return { years, rows };
}

function buildCardByKey(key) {
  const { idsrData, doc } = PARSED;
  switch (key) {
    case 'attendance': return buildAttendanceCard(idsrData, doc);
    case 'p8': return buildP8Card(idsrData);
    case 'alevel': return buildSimpleCard(idsrData, CARD_ROWS_ALEVEL);
    case 'gcse': return buildMetricGapCard(idsrData, GCSE_METRICS);
    case 'english': return buildMetricGapCard(idsrData, SUBJECT_METRICS.english);
    case 'mathematics': return buildMetricGapCard(idsrData, SUBJECT_METRICS.mathematics);
    case 'science': return buildMetricGapCard(idsrData, SUBJECT_METRICS.science);
    case 'languages': return buildMetricGapCard(idsrData, SUBJECT_METRICS.languages);
    case 'humanities': return buildMetricGapCard(idsrData, SUBJECT_METRICS.humanities);
    case 'destinations': {
      const ks4 = parseDestinationsPanel(doc, 'after-key-stage-4', DEST_TARGET_LABELS.map(t => t.label));
      const p1618 = parseDestinationsPanel(doc, 'after-16-to-18', DEST_TARGET_LABELS.map(t => t.label));
      return { ks4, p1618 };
    }
    case 'priorattainment': {
      const cohorts = {};
      for (const cohort of PRIOR_ATTAINMENT_COHORTS) {
        const rowSpecs = PRIOR_ATTAINMENT_METRICS.map(m => ({ section: m.section, group: cohort, measure: m.measure }));
        cohorts[cohort] = buildSimpleCard(idsrData, rowSpecs);
      }
      return cohorts;
    }
  }
}

function getCard(key) {
  if (!CARDS[key]) CARDS[key] = buildCardByKey(key);
  return CARDS[key];
}

function unitFor(row) {
  if (row.isCount) return '';
  if (row.kind === 'pct') return '%';
  return ''; // pts (Attainment 8) and idx (Progress 8 / VA) are plain numbers, no unit
}

function renderDestinations() {
  const card = getCard('destinations');
  function renderPanelTable(panelData) {
    if (!panelData) return '<p class="no-data">There is no data in this section for this school \u2014 the DfE export itself reports it as unavailable, not a parsing gap.</p>';
    function renderCohortTable(cohortData, cohortTitle) {
      if (!cohortData) return '';
      let html = '<table class="data-table"><thead><tr><th>' + cohortTitle + '</th>' + cohortData.years.map(y => '<th>' + y + '</th>').join('') + '</tr></thead><tbody>';
      for (const { label, display } of DEST_TARGET_LABELS) {
        const row = cohortData.rows[label];
        if (!row) continue;
        const cells = row.values.map((v, i) => {
          const sig = row.sigLabels[i];
          const band = bandFromSig(sig);
          const cls = band ? 'cell-' + band : '';
          const disp = (v === null || v === undefined) ? '\u2014' : v + '%';
          const title = band ? BAND_LABEL[band] : (sig || '');
          return '<td class="' + cls + '" title="' + title + '">' + disp + '</td>';
        }).join('');
        html += '<tr><td>' + display + '</td>' + cells + '</tr>';
      }
      html += '</tbody></table>';
      return html;
    }
    return renderCohortTable(panelData.allPupils, 'All pupils') + renderCohortTable(panelData.disadvantaged, 'Disadvantaged');
  }
  document.getElementById('ks4Content').innerHTML = renderPanelTable(card.ks4);
  document.getElementById('ks4Sub').textContent = card.ks4 ? 'Banded directly from DfE\u2019s own significance verdict per cell \u2014 no raw national figure exists for this measure.' : '';
  document.getElementById('p1618Content').innerHTML = renderPanelTable(card.p1618);
  document.getElementById('p1618Sub').textContent = card.p1618 ? 'Banded directly from DfE\u2019s own significance verdict per cell \u2014 no raw national figure exists for this measure.' : '';
}

// Generic table renderer — returns an HTML string rather than touching the
// DOM directly, so both the single-card path and Prior Attainment's three
// stacked panels can share it without duplicating the logic.
function renderMetricTableHTML(card, firstColLabel, isGapType, onRowClick) {
  let thead = '<thead><tr><th rowspan="2">' + firstColLabel + '</th>' +
    card.years.map(y => '<th colspan="2">' + y + '</th>').join('') +
    (isGapType ? '<th rowspan="2">Latest Gap</th>' : '') +
    '</tr><tr>' + card.years.map(() => '<th>School</th><th>National</th>').join('') + '</tr></thead>';

  let bodyHtml = '';
  let lastSection = null;
  card.rows.forEach((row, idx) => {
    if (row.section !== lastSection) {
      bodyHtml += '<tr class="section-row"><td colspan="' + (card.years.length * 2 + 1 + (isGapType ? 1 : 0)) + '">' + row.section + '</td></tr>';
      lastSection = row.section;
    }
    const unit = unitFor(row);
    const cells = row.values.map((v, i) => {
      const b = cellBand(row, i);
      const cls = b ? 'cell-' + b : '';
      const disp = (v === null || v === undefined) ? '\u2014' : (unit === '%' ? v + '%' : v);
      const n = row.natByYear[i];
      const natDisp = (n === null || n === undefined) ? '\u2014' : (unit === '%' ? n + '%' : n);
      return '<td class="' + cls + '" title="' + (b ? BAND_LABEL[b] : '') + '">' + disp + '</td>' + '<td class="natcell">' + natDisp + '</td>';
    }).join('');

    let gapCell = '';
    if (isGapType) {
      gapCell = '<td class="gapcell">\u2014</td>';
      if (row.isGap) {
        const gi = lastAvailableGapIdx(row);
        if (gi !== -1) {
          const g = row.gapByYear[gi], t = row.gapTrendByYear[gi];
          gapCell = '<td class="gapcell">' + (g === null ? '\u2014' : g) + (t ? ' (' + t + ')' : '') + '</td>';
        }
      }
    }

    const clickAttr = onRowClick ? ' onclick="' + onRowClick + '(' + idx + ')" class="data-row"' : '';
    bodyHtml += '<tr' + clickAttr + ' data-idx="' + idx + '"><td>' + row.group + '</td>' + cells + gapCell + '</tr>';
  });

  return thead + '<tbody>' + bodyHtml + '</tbody>';
}

function renderTable() {
  const meta = CARD_META.find(c => c.key === activeCard);
  const card = getCard(activeCard);
  const isGapType = meta.type === 'metric-table-gap';
  document.getElementById('dataTable').innerHTML = renderMetricTableHTML(card, meta.firstColLabel, isGapType, 'selectRow');
  // re-apply the selected-row highlight (renderMetricTableHTML doesn't know about selection state)
  document.querySelectorAll('#dataTable tbody tr[data-idx]').forEach(tr => {
    tr.classList.add('data-row');
    tr.classList.toggle('row-selected', parseInt(tr.dataset.idx) === selectedRowIdx);
  });
  document.getElementById('panelSub').textContent =
    'Every year is banded independently against that same year\u2019s own national figure, shown right alongside it.' +
    (isGapType ? ' Disadvantaged rows band against national disadvantaged; Latest Gap (vs national non-disadvantaged) is shown for context, unbanded.' : '') + ' ' +
    card.years.filter(y => y).join(' \u2013 ') + '.';
}

function renderDashboardCard() {
  const card = getCard(activeCard);
  const row = card.rows[selectedRowIdx];
  const lastIdx = lastAvailableIdx(row);
  document.getElementById('chartTitle').innerHTML = row.label + ' <span class="badge ' + (cellBand(row, lastIdx) || 'expected') + '">' + (BAND_LABEL[cellBand(row, lastIdx)] || 'No data') + '</span>';
  document.getElementById('chartSub').textContent = 'School vs National' + (row.isGap ? ' (disadvantaged) & non-disadvantaged' : '') + ', ' + card.years.filter(y => y).join(' \u2013 ');

  const datasets = [
    { label: 'School', data: row.values, borderColor: '#0D2B4E', backgroundColor: '#0D2B4E', tension: 0.25, spanGaps: true },
    { label: row.isGap ? 'National (disadvantaged)' : 'National', data: row.natByYear, borderColor: '#1A7A6E', backgroundColor: '#1A7A6E', borderDash: [5, 4], tension: 0.25, spanGaps: true }
  ];
  if (row.isGap) datasets.push({ label: 'National (non-disadvantaged)', data: row.natNonDisByYear, borderColor: '#B08300', backgroundColor: '#B08300', borderDash: [2, 3], tension: 0.25, spanGaps: true });

  const allVals = row.values.concat(row.natByYear).concat(row.isGap ? row.natNonDisByYear : []).filter(v => v !== null && v !== undefined);
  let yMin, yMax;
  if (allVals.length) {
    const dataMin = Math.min(...allVals), dataMax = Math.max(...allVals);
    const range = dataMax - dataMin;
    const pad = Math.max(row.isCount ? 1 : (row.kind === 'idx' ? 0.05 : (row.kind === 'pts' ? 1 : 2)), range * (row.kind === 'idx' ? 0.2 : 0.15));
    yMin = dataMin - pad; yMax = dataMax + pad;
    if (row.isCount) yMin = Math.max(0, yMin);
  }

  const ctx = document.getElementById('detailChart').getContext('2d');
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels: card.years, datasets },
    options: {
      responsive: true,
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } },
      scales: { y: { min: yMin, max: yMax, ticks: { font: { size: 10 } } }, x: { ticks: { font: { size: 10 } } } }
    }
  });

  const gapInfo = document.getElementById('gapInfo');
  if (row.isGap) {
    const gi = lastAvailableGapIdx(row);
    if (gi !== -1) {
      gapInfo.style.display = 'block';
      gapInfo.innerHTML = '<b>Latest Gap:</b> ' + row.gapByYear[gi] + ' (' + card.years[gi] + ') &nbsp; <b>Trend:</b> ' + (row.gapTrendByYear[gi] || '\u2014');
    } else gapInfo.style.display = 'none';
  } else gapInfo.style.display = 'none';
}

function selectRow(idx) {

    window.idsrDashboardReady = true;
    return;
  }

  renderTopbarActions();

  const { data: fileBlob, error: downloadErr } = await sb.storage.from('idsr-uploads').download(uploadRow.storage_path);
  if (downloadErr || !fileBlob) {
    showEmptyState('Couldn\u2019t load the IDSR file', 'There was a problem fetching the uploaded file. Try again, or contact support if this persists.');
    window.idsrDashboardReady = true;
    return;
  }

  const htmlText = await fileBlob.text();
  const idsrData = parseIDSRHtml(htmlText);
  const doc = new DOMParser().parseFromString(htmlText, 'text/html');
  PARSED = { idsrData, doc };
  CARDS = {};

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('shell').classList.add('visible');
  const note = document.getElementById('parseNote');
  note.textContent = 'Parsed ' + Object.keys(idsrData).length + ' group/measure tables from the uploaded IDSR. Uploaded ' + fmtDate(uploadRow.uploaded_at) +
    (uploadRow.status === 'published' ? ', published ' + fmtDate(uploadRow.published_at) : ' — pending review') + '.';
  note.classList.add('visible');

  openCard('attendance');
  window.idsrDashboardReady = true;
}

window.idsrDashboardReady = false;
boot();
</script>
</body>
</html>
